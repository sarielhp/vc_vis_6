name = "RootTask"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RootTask"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "comparator"
git = "https://github.com/leanprover/comparator.git"
rev = "v4.31.0"

[[lean_lib]]
name = "RootTask"
roots = ["RootTask"]
globs = ["RootTask.*"]
